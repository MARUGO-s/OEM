<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <title>marugo — サイトへ移動</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f6f7fb;color:#263144;font-family:system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}main{max-width:440px;width:100%;padding:36px;border:1px solid #e3e6ed;border-radius:20px;background:white;text-align:center}small{color:#6b61bc;letter-spacing:.15em;font-weight:700}h1{font-size:22px;margin:24px 0 16px}p{font-size:14px;line-height:1.8;color:#606c7b}button{background:#6b61bc;color:white;border:0;padding:12px 20px;border-radius:9px;font:inherit;cursor:pointer}button:disabled{opacity:.6}[hidden]{display:none!important}
  </style>
</head>
<body>
  <main>
    <small>MARUGO</small>
    <h1 id="heading">サイトへ移動しています</h1>
    <p id="status" role="status">アクセスを記録しています。少しお待ちください。</p>
    <button id="retry" type="button" hidden>もう一度試す</button>
    <noscript><p>移動にはJavaScriptを有効にしてください。</p></noscript>
  </main>
  <script type="module" src="./redirect.js"></script>
</body>
</html>
