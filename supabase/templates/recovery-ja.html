<!doctype html>
<html lang="ja">
  <body
    style="
      margin: 0;
      background: #f5f3fa;
      font-family:
        Arial, &quot;Hiragino Kaku Gothic ProN&quot;, Meiryo, sans-serif;
      color: #292738;
    "
  >
    <div
      style="
        max-width: 560px;
        margin: 32px auto;
        padding: 32px;
        background: #ffffff;
        border-radius: 16px;
      "
    >
      <p style="letter-spacing: 3px; color: #7360c8; font-weight: bold">
        MARUGO
      </p>
      <h2>パスワードの再設定</h2>
      <p style="line-height: 1.8">
        パスワードの再設定を受け付けました。以下のボタンから新しいパスワードを設定してください。
      </p>
      <p style="margin: 28px 0">
        <a
          href="{{ .ConfirmationURL }}"
          style="
            display: inline-block;
            padding: 14px 24px;
            border-radius: 8px;
            background: #6b5bd3;
            color: #ffffff;
            text-decoration: none;
          "
          >新しいパスワードを設定する</a
        >
      </p>
      <p style="line-height: 1.8">
        再設定メールを依頼した端末・ブラウザーで開いてください。リンクを他の方と共有しないでください。期限切れの場合は、アプリから再設定メールを送信し直してください。
      </p>
      <p style="line-height: 1.8; color: #787387; font-size: 13px">
        このメールに心当たりがない場合は、操作せずに破棄してください。操作しなければパスワードは変更されません。このメールへの返信は受け付けていません。
      </p>
    </div>
  </body>
</html>
